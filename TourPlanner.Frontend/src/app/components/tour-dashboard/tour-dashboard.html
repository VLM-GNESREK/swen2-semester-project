<h2>Tour Planner</h2>

<div>
  <h3>Create Tour</h3>
  <input placeholder="Name" [(ngModel)]="newTour.name" required>
  <input placeholder="From" [(ngModel)]="newTour.from" required>
  <input placeholder="To" [(ngModel)]="newTour.to" required>
  <input placeholder="Description" [(ngModel)]="newTour.description">
  <select [(ngModel)]="newTour.transportType" required>
    <option value="" disabled selected>Select transport type</option>
    <option value="Car">Car</option>
    <option value="Bicycle">Bicycle</option>
    <option value="Walking">Walking</option>
  </select>
  <button (click)="addTour()">Add Tour</button>

</div>

<hr>

<div>
  <h3>Tour List</h3>
  @for (tour of toursUIonly; track tour.id) 
  {
    <div style="border:1px solid black; margin:5px; padding:5px;">

      @if (editingTourId === tour.id)
      {
        <input [(ngModel)]="editedTour.name" placeholder="Name">
        <input [(ngModel)]="editedTour.from" placeholder="From">
        <input [(ngModel)]="editedTour.to" placeholder="To">
        <input [(ngModel)]="editedTour.description" placeholder="Description">
        <select [(ngModel)]="editedTour.transportType" required>
          <option value="" disabled selected>Select transport type</option>
          <option value="Car">Car</option>
          <option value="Bicycle">Bicycle</option>
          <option value="Walking">Walking</option>
        </select>
        <input [(ngModel)]="editedTour.distance" placeholder="Distance">
        <input [(ngModel)]="editedTour.estimatedTime" placeholder="Estimated Time">
        <input [(ngModel)]="editedTour.routeInformation" placeholder="Route Info">
        <button (click)="saveTour(tour.id)">Save</button>
        <button (click)="cancelEdit()">Cancel</button>
      }

      @if (editingTourId !== tour.id)
      {
        <strong>{{ tour.name }}</strong><br>
        {{ tour.from }} → {{ tour.to }}<br>
        {{ tour.description }}<br>
        <button (click)="editTour(tour)">Edit</button>
        <button (click)="deleteTour(tour.id)">Delete</button>
      }

    </div>
  }
</div>
