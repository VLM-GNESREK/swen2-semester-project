<div class="container mt-4">
    <div class="row">
        <div class="col-md-4">
            <div class="card mb-4">
                <div class="card-header">
                    <h5 class="card-title mb-0">Add Tour Log</h5>
                </div>
                <div class="card-body">
                    <div class="mb-3">
                        <label class="form-label">Date</label>
                        <input type="date" class="form-control" [(ngModel)]="newLog.date">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">User Name</label>
                        <input type="text" class="form-control" [(ngModel)]="newLog.username">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Distance</label>
                        <input type="number" class="form-control" [(ngModel)]="newLog.totalDistance">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Total Time</label>
                        <input type="number" class="form-control" [(ngModel)]="newLog.totalTime">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Rating (1-5)</label>
                        <input type="number" class="form-control" [(ngModel)]="newLog.rating" min="1" max="5">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Difficulty</label>
                        <input type="number" class="form-control" [(ngModel)]="newLog.difficulty" min="1" max="5">
                    </div>
                    <button class="btn btn-primary w-100" (click)="addLog()">Save Log</button>
                </div>
            </div>
        </div>

        <div class="col-md-8">
            <h3>Tour Logs</h3>
            @if (logs.length === 0) 
            {
                <div class="alert alert-info">No logs found for this tour.</div>
            } 
            @else 
            {
                <div class="list-group">
                    @for (log of logs; track log.id) 
                    {
                        <div class="list-group-item">
                            <div class="d-flex w-100 justify-content-between">
                                <h5 class="mb-1">{{ log.username }} - {{ log.date }}</h5>
                                <small>Rating: {{ log.rating }}/5</small>
                            </div>
                            <p class="mb-1">
                                <strong>Difficulty:</strong> {{ log.difficulty }} | 
                                <strong>Distance:</strong> {{ log.totalDistance }} km | 
                                <strong>Time:</strong> {{ log.totalTime }}
                            </p>
                            <button class="btn btn-sm btn-danger mt-2" (click)="deleteLog(log.id)">Delete</button>
                        </div>
                    }
                </div>
            }
        </div>
    </div>
</div>
